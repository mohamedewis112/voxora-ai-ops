name: Bootstrap Voxora source
on:
  push:
    branches: [feat/full-ops-integration]
    paths: [".github/workflows/bootstrap-source.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/full-ops-integration
          fetch-depth: 0
      - name: Inspect Firestorage API bundle
        env:
          SHARE_URL: https://firestorage.ai/ja/f/dv8eY4qY9Qm8
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html,re,urllib.request
          from urllib.parse import urljoin
          share="https://firestorage.ai/ja/f/dv8eY4qY9Qm8"
          def get(u):
              req=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0"})
              return urllib.request.urlopen(req,timeout=25).read().decode("utf-8","ignore")
          page=get(share)
          js=[urljoin(share,x) for x in re.findall(r'(?:src|href)=["\']([^"\']+\.js[^"\']*)["\']',page,re.I)]
          print("JS",len(js))
          for u in js:
              try: t=get(u)
              except Exception: continue
              needle="/files?maxResults=1000"
              i=t.find(needle)
              if i>=0:
                  print("FOUND",u)
                  print(t[max(0,i-6000):min(len(t),i+4000)])
                  print("URLS")
                  for x in sorted(set(re.findall(r'https?://[^"\'\\ ]+',t))):
                      print(x[:500])
                  break
          PY
          exit 2
