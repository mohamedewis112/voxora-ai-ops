name: Bootstrap Voxora source

on:
  push:
    branches: [feat/full-ops-integration]
    paths: [".github/workflows/bootstrap-source.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/full-ops-integration
          fetch-depth: 0

      - name: Discover Firestorage download endpoint
        env:
          SHARE_URL: https://firestorage.ai/ja/f/Kv7G0bi0bdHd
          FILE_ID: 01a1d51fecbf702aa3c4c2dbd75c09e7
          PUBLIC_ID: nftEiw4hcTBsuEd3
          SHARE_ID: Kv7G0bi0bdHd
          FILE_NAME: voxora-ai-ops-bootstrap.zip
        run: |
          python3 - <<'PY'
          import html, os, re
          from urllib.parse import urljoin, urlparse
          from urllib.request import Request, urlopen

          share=os.environ["SHARE_URL"]
          needles=["download","signed","publicId","public_id","fileId","file_id","shareId","share_id",
                   os.environ["FILE_ID"],os.environ["PUBLIC_ID"],os.environ["SHARE_ID"],os.environ["FILE_NAME"]]
          def get(u):
              req=Request(u,headers={"User-Agent":"Mozilla/5.0","Accept":"*/*"})
              with urlopen(req,timeout=20) as r:
                  return r.geturl(),r.read().decode("utf-8","ignore")
          final,page=get(share)
          print("PAGE",final,"chars",len(page))
          sources=[urljoin(final,html.unescape(x)) for x in re.findall(r'(?:src|href)=["\']([^"\']+)["\']',page,re.I)]
          js=[u for u in sources if urlparse(u).netloc=="firestorage.ai" and ".js" in u]
          docs=[("PAGE",final,page)]
          for u in js:
              try:
                  fu,t=get(u)
                  if len(t)<4_000_000:
                      docs.append(("JS",fu,t))
              except Exception:
                  pass
          print("JS_COUNT",len(docs)-1)
          found=set()
          for kind,u,t in docs:
              for pat in [
                  r'https://firestorage\.ai[^"\'\\\s<>]+',
                  r'["\'](/api/[^"\'\\\s<>]+)["\']',
                  r'["\'](/[^"\'\\\s<>]*(?:download|signed)[^"\'\\\s<>]*)["\']'
              ]:
                  for m in re.findall(pat,t,re.I):
                      if isinstance(m,tuple): m=m[0]
                      found.add(urljoin(u,html.unescape(m).replace("\\/","/")))
              low=t.lower()
              for needle in needles:
                  start=0
                  n=needle.lower()
                  shown=0
                  while shown<4:
                      i=low.find(n,start)
                      if i<0: break
                      frag=t[max(0,i-260):min(len(t),i+520)].replace("\n"," ")
                      print("SNIP",kind,u,needle,repr(frag[:900]))
                      start=i+len(n); shown+=1
          print("CANDIDATES")
          for u in sorted(found):
              print(u)
          PY
          exit 2
